<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .game-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            color: #555;
            min-height: 30px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0 auto 30px;
            max-width: 360px;
        }

        .cell {
            aspect-ratio: 1;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.taken) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .new-game-btn {
            background: #667eea;
            color: white;
        }

        .new-game-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .winner {
            font-size: 1.5em;
            font-weight: bold;
            color: #764ba2;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic-Tac-Toe AI</h1>
        <div class="subtitle">당신 (X) vs AI (O)</div>
        
        <div class="game-info" id="gameInfo">게임을 시작하세요!</div>
        
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        
        <div class="controls">
            <button class="new-game-btn" onclick="newGame()">새 게임</button>
        </div>
        
        <div class="stats" id="stats">
            게임 횟수: <span id="totalGames">0</span> | 
            승: <span id="wins">0</span> | 
            패: <span id="losses">0</span> | 
            무: <span id="draws">0</span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/tictactoe';
        let board = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        let gameActive = true;
        let stats = {
            totalGames: 0,
            wins: 0,
            losses: 0,
            draws: 0
        };

        // Load stats from localStorage
        function loadStats() {
            const saved = localStorage.getItem('tictactoeStats');
            if (saved) {
                stats = JSON.parse(saved);
                updateStatsDisplay();
            }
        }

        function saveStats() {
            localStorage.setItem('tictactoeStats', JSON.stringify(stats));
            updateStatsDisplay();
        }

        function updateStatsDisplay() {
            document.getElementById('totalGames').textContent = stats.totalGames;
            document.getElementById('wins').textContent = stats.wins;
            document.getElementById('losses').textContent = stats.losses;
            document.getElementById('draws').textContent = stats.draws;
        }

        function updateDisplay() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                const value = board[index];
                cell.textContent = value === 1 ? 'X' : value === -1 ? 'O' : '';
                cell.className = 'cell';
                if (value !== 0) {
                    cell.classList.add('taken');
                    cell.classList.add(value === 1 ? 'x' : 'o');
                }
            });
        }

        async function handleCellClick(index) {
            if (!gameActive || board[index] !== 0) return;

            // Human move
            board[index] = 1;
            updateDisplay();
            document.getElementById('gameInfo').textContent = 'AI가 생각중...';
            document.getElementById('board').classList.add('loading');

            // Check if human won
            const winner = checkWinner();
            if (winner !== null) {
                endGame(winner);
                return;
            }

            // Get AI move
            try {
                const response = await fetch(`${API_URL}/move`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ board: board })
                });

                const data = await response.json();
                
                if (data.move !== null) {
                    board = data.board;
                    updateDisplay();
                }

                document.getElementById('board').classList.remove('loading');

                if (data.winner !== null) {
                    endGame(data.winner);
                } else {
                    document.getElementById('gameInfo').textContent = '당신의 차례! (X)';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('gameInfo').textContent = 'API 오류 발생!';
                document.getElementById('board').classList.remove('loading');
            }
        }

        function checkWinner() {
            const wins = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]              // diagonals
            ];

            for (const combo of wins) {
                if (board[combo[0]] === board[combo[1]] && 
                    board[combo[1]] === board[combo[2]] && 
                    board[combo[0]] !== 0) {
                    return board[combo[0]];
                }
            }

            if (!board.includes(0)) return 0; // Draw
            return null; // Game continues
        }

        function endGame(winner) {
            gameActive = false;
            const infoEl = document.getElementById('gameInfo');
            infoEl.classList.add('winner');
            
            stats.totalGames++;
            
            if (winner === 1) {
                infoEl.textContent = '🎉 축하합니다! 당신이 이겼습니다!';
                stats.wins++;
            } else if (winner === -1) {
                infoEl.textContent = '😅 AI가 이겼습니다!';
                stats.losses++;
            } else {
                infoEl.textContent = '🤝 무승부입니다!';
                stats.draws++;
            }
            
            saveStats();
        }

        function newGame() {
            board = [0, 0, 0, 0, 0, 0, 0, 0, 0];
            gameActive = true;
            updateDisplay();
            document.getElementById('gameInfo').textContent = '당신의 차례! (X)';
            document.getElementById('gameInfo').classList.remove('winner');
        }

        // Initialize
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const index = parseInt(cell.dataset.index);
                handleCellClick(index);
            });
        });

        loadStats();
        newGame();
    </script>
</body>
</html>
